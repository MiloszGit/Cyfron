    <script>
        // Pobieranie danych z pliku en.json
        fetch('en.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }
                return response.json(); // Parsowanie JSON-a do obiektu
            })
            .then(data => {
                // Wstawienie danych z JSON do elementu HTML
                const contentDiv = document.getElementById('content');
                contentDiv.textContent = data.message; // Wyświetlenie klucza "message"
            })
            .catch(error => {
                console.error('Błąd podczas ładowania JSON:', error);
                document.getElementById('content').textContent = "Nie udało się załadować danych.";
            });
    </script>
